# neat_config.ini
# NEAT-Python configuration

[NEAT]
fitness_criterion     = max
fitness_threshold     = 1000000
pop_size              = 300
reset_on_extinction   = True

[DefaultGenome]
# Node activation
activation_default      = sigmoid
activation_mutate_rate  = 0.0
activation_options      = sigmoid

# Node aggregation
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

# Bias
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.15
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1

# Compatibility
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.4

# Connection
conn_add_prob           = 0.08
conn_delete_prob        = 0.02

# Enable/disable
enabled_default         = True
enabled_mutate_rate     = 0.01

# Feed forward only?
feed_forward            = False

# Initial connectivity
initial_connection      = partial_direct 0.5

# Node counts (must match your config)
num_hidden              = 0
num_inputs              = 165
num_outputs             = 49

# Node mutation
node_add_prob           = 0.01
node_delete_prob        = 0.005

# Response (output multiplier)
response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

# Weights
weight_init_mean        = 0.0
weight_init_stdev       = 1.0
weight_max_value        = 30.0
weight_min_value        = -30.0
weight_mutate_power     = 0.15
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 30
species_elitism      = 2

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.3
